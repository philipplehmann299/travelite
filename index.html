<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Travelite</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0a0a0b;--c1:#151517;--c2:#1f1f22;--ln:#2e2e32;--tx:#e6e6ea;--mu:#8b8b94;--gold:#dcab2a;--sil:#c4c6cc;--ok:#5fbf7f;--bad:#e0605e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
h2,h3,nav button,.btn,label,.fab,.tag,.lc,header button{text-transform:lowercase}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.logo{font-size:23px;font-weight:800}.logo b{background:linear-gradient(90deg,#9a9ca3,#f2f3f6,#b4b6bd);-webkit-background-clip:text;background-clip:text;color:transparent}.logo i{font-style:normal;background:linear-gradient(90deg,#a8821c,#f5da7a,#c79a22);-webkit-background-clip:text;background-clip:text;color:transparent}
header button{background:var(--c2);border:1px solid var(--ln);color:var(--tx);border-radius:18px;padding:6px 11px;font-size:13px;margin-left:6px}
nav{display:flex;overflow-x:auto;gap:6px;padding:9px 12px;border-bottom:1px solid var(--ln);scrollbar-width:none}
nav button{flex:0 0 auto;background:var(--c1);border:1px solid var(--ln);color:var(--mu);padding:7px 12px;border-radius:16px;font-size:14px}
nav button.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
nav.sub button{font-size:12px;padding:5px 10px}
#side{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));bottom:0;left:0;width:200px;background:var(--c1);border-right:1px solid var(--ln);overflow-y:auto;padding:8px;transform:translateX(-101%);transition:transform .2s;z-index:6;display:flex;flex-direction:column;gap:3px}
#side.open{transform:none}#side button{background:none;border:0;color:var(--mu);text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;text-transform:lowercase}
#side button.on{background:var(--c2);color:var(--gold);font-weight:700}#side button.sb{padding:6px 12px 6px 28px;font-size:13px}
@media(min-width:700px){body.sh{padding-left:200px}}
.s-ok{color:var(--ok)!important;border-color:var(--ok)!important}.s-wa{color:var(--gold)!important;border-color:var(--gold)!important}.s-bad{color:var(--bad)!important;border-color:var(--bad)!important}
.card[data-d],.card[data-go]{cursor:pointer}
header button:empty{display:none}nav:empty{display:none}.navw{position:relative;border-bottom:1px solid var(--ln)}.navw:has(nav:empty){display:none}.navw nav{border:0}
.ar{display:none;position:absolute;top:0;bottom:0;width:28px;align-items:center;justify-content:center;font-size:24px;color:var(--gold);pointer-events:none}
.ar.l{left:0;background:linear-gradient(90deg,var(--bg),transparent)}.ar.r{right:0;background:linear-gradient(270deg,var(--bg),transparent)}.hl .l,.hr .r{display:flex}
details summary{cursor:pointer;color:var(--sil);list-style:none}.btn:disabled{opacity:.4}
main{flex:1;width:100%;padding:12px 14px 20px;max-width:640px;margin:0 auto}
h2{font-size:12px;letter-spacing:1.5px;color:var(--sil);margin:18px 0 8px}
.card{background:var(--c1);border:1px solid var(--ln);border-radius:14px;padding:11px 14px;margin-bottom:9px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.wr{flex-wrap:wrap;justify-content:flex-start}
.mu{color:var(--mu);font-size:13px}.gold{color:var(--gold)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.btn{background:var(--c2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font-size:13px}.btn.p{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}.btn.s{padding:4px 9px;font-size:12px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--gold);color:#111;border:0;border-radius:28px;padding:14px 20px;font-weight:800;box-shadow:0 4px 18px #000a}
.tag{display:inline-block;background:var(--c2);border:1px solid var(--ln);border-radius:8px;padding:1px 7px;font-size:11px;color:var(--sil);margin-right:4px}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--mu);background:none;color:#111;font-weight:900;flex:0 0 auto}.chk.on{background:var(--ok);border-color:var(--ok)}
.done{text-decoration:line-through;color:var(--mu)}.big{font-size:34px;font-weight:800;color:var(--gold)}.pts{font-size:20px;font-weight:800;color:var(--gold)}
#modal{display:none;position:fixed;inset:0;background:#000b;z-index:9;align-items:flex-end;justify-content:center}#modal.on{display:flex}
#sheet{background:var(--c1);border:1px solid var(--ln);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit}
.ck{display:flex;gap:8px;align-items:center;padding:3px 0}.ck input{width:auto}
.empty{text-align:center;color:var(--mu);padding:22px 0}a{color:var(--gold)}
.msg{background:var(--c2);border-radius:12px;padding:7px 11px;margin-bottom:7px;max-width:85%}.msg.me{margin-left:auto;background:#3a3216}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>#auth{position:fixed;inset:0;z-index:20;background:#0a0a0b;display:flex;align-items:center;justify-content:center;padding:20px}#auth form{width:100%;max-width:340px}#auth .row{margin-top:14px}#auth p{color:#8b8b94;font-size:13px;min-height:18px}</style></head><body>
<header><div style="display:flex;align-items:center"><button id="bk" style="margin:0 6px 0 0"></button><button id="bs" style="margin:0 8px 0 0"></button><div class="logo" style="cursor:pointer"><b>trav</b><i>elite</i></div></div><div><button id="bt"></button><button id="bl"></button><button id="bp"></button></div></header>
<div class="navw"><nav id="nav"></nav><span class="ar l">‹</span><span class="ar r">›</span></div><nav id="snav" style="display:none"></nav><aside id="side"></aside><main id="app"></main><div id="fabw"></div>
<footer id="ft" style="text-align:center;margin-top:auto;padding:16px 0 90px;font-size:12px"></footer><div id="modal"><div id="sheet"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang='de';try{lang=localStorage.getItem('tl')||'de'}catch(e){}
const L=(d,e)=>lang==='en'?e:d;
let S={m:{},i:{}},uid='local',vu={},db=null,ready=false,cur=null,tab='home',subs={transfer:'reisen',wohnen:'unterkunft',act:'vorschlaege',todo:'meine',rank:'score',team:'team',fin:'ausgaben'},pkAll=false,tf='all',sideOpen=innerWidth>=700,sc={},LP={},curSL='all',acc=null;
const uidn=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const prof=u=>S.m[u]||{},me=()=>S.m[uid],trip=()=>S.i[cur]||{},mrec=u=>S.i['m_'+cur+'_'+u];
const lead=()=>{const m=mrec(uid);return !!m&&m.role==='travellead'};
const dn=u=>{const p=prof(u);if(!p.first)return'?';return trip().nm==='alias'&&p.alias?p.alias:p.first+' '+(p.last||'').slice(0,1)+'.'};
const av=u=>esc(prof(u).av||'🙂');
const list=t=>Object.entries(S.i).filter(([,v])=>v.t===t&&v.T===cur).map(([id,v])=>({id,...v})).sort((a,b)=>(a.c||0)-(b.c||0));
const mems=()=>list('mem');const mo=()=>mems().map(m=>[m.u,dn(m.u)]);
const eur=n=>(Math.round(n*100)/100).toLocaleString(lang==='en'?'en-US':'de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const dt=v=>v?new Date(v).toLocaleString(lang==='en'?'en-GB':'de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const dd=v=>v?new Date(v).toLocaleDateString(lang==='en'?'en-GB':'de-DE'):'';
const maps=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
function put(id,d){S.i[id]=d;if(db)db.collection('items').doc(id).set(d).catch(()=>{});render()}
function del(id){delete S.i[id];if(db)db.collection('items').doc(id).delete().catch(()=>{});render()}
const P=(t,d,id)=>put(id||uidn(),{t,T:cur,c:Date.now(),...d});
const U=(id,d)=>put(id,{...S.i[id],...d});
function putM(d){S.m[uid]=d;if(db)db.collection('members').doc(uid).set(d).catch(()=>{});render()}
async function init(){
  try{const u=await claude.use('user');if(u){uid=(await u.id())||'local';try{vu=await u.me()||{}}catch(e){}}db=await claude.use('db')}catch(e){}
  if(db){let n=0,f=[0,0];const fin=()=>{if(++n>=2)ready=true;render()};
    db.collection('members').onSnapshot(s=>{S.m={};s.docs.forEach(d=>S.m[d.id]=d.data());f[0]++==0?fin():render()});
    db.collection('items').onSnapshot(s=>{S.i={};s.docs.forEach(d=>S.i[d.id]=d.data());f[1]++==0?fin():render()});
  }else{ready=true;render()}
}
function form(title,fields,cb,lock){
  const h=fields.map(f=>{const id='f_'+f.k,v=f.v??'';let x;
    if(f.type==='select')x=`<select id="${id}">${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]===v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
    else if(f.type==='multi')x=f.o.map(o=>`<div class="ck"><input type="checkbox" name="${id}" value="${esc(o[0])}" ${(f.v||f.o.map(a=>a[0])).includes(o[0])?'checked':''}> ${esc(o[1])}</div>`).join('');
    else if(f.type==='area')x=`<textarea id="${id}" rows="2">${esc(v)}</textarea>`;
    else x=`<input id="${id}" type="${f.type||'text'}" value="${esc(v)}" ${f.type==='number'?'step="0.01" inputmode="decimal"':''}>`;
    return `<label>${esc(f.l)}</label>${x}`}).join('');
  $('#sheet').innerHTML=`<h3 style="margin:0 0 4px">${esc(title)}</h3>${h}<div class="row" style="margin-top:16px">${lock?'<span></span>':`<button class="btn" id="fx">${L('abbrechen','cancel')}</button>`}<button class="btn p" id="fo">${L('speichern','save')}</button></div>`;
  $('#modal').classList.add('on');if(!lock)$('#fx').onclick=close;
  $('#fo').onclick=()=>{const v={};for(const f of fields)v[f.k]=f.type==='multi'?[...document.getElementsByName('f_'+f.k)].filter(c=>c.checked).map(c=>c.value):$('#f_'+f.k).value.trim();if(cb(v)!==false)close()};
}
const close=()=>$('#modal').classList.remove('on');
function profile(edit){const p=me()||{};
  form(edit?L('profil','profile'):L('willkommen bei travelite','welcome to travelite'),[
   {k:'first',l:L('vorname','first name'),v:p.first||(vu.name||'').split(' ')[0]},{k:'last',l:L('nachname','last name'),v:p.last||(vu.name||'').split(' ').slice(1).join(' ')},
   {k:'email',l:L('e-mail','email'),v:p.email||vu.email||''},{k:'alias',l:'alias',v:p.alias},{k:'av',l:L('profilbild (emoji)','avatar (emoji)'),v:p.av||'🙂'},
   {k:'bd',l:L('geburtsdatum (optional)','birth date (optional)'),type:'date',v:p.bd},{k:'pass',l:L('reisepass-nr. (optional)','passport no. (optional)'),v:p.pass},{k:'pe',l:L('pass gültig bis (optional)','passport expires (optional)'),type:'date',v:p.pe},
   ],
   v=>{if(!v.first||!v.last)return false;putM(v)},!edit)}
function newTrip(){form(L('neue reise','new travel'),[{k:'name',l:'name'},{k:'ort',l:L('ort (stadt, land oder insel)','place (city, country or island)')},{k:'s',l:L('start','start'),type:'date'},{k:'e',l:L('ende','end'),type:'date'},{k:'av',l:L('titelbild (emoji)','cover (emoji)'),v:'🌴'}],
  v=>{if(!v.name||!v.ort||!v.s||!v.e)return false;const id=uidn();put(id,{t:'trip',name:v.name,ort:v.ort,s:v.s,e:v.e,av:v.av,nm:'short',c:Date.now()});put('m_'+id+'_'+uid,{t:'mem',T:id,u:uid,role:'travellead',c:Date.now()});cur=id;tab='home'})}
function joinFlow(id){const t=S.i[id];if(!t||t.t!=='trip')return;form(L('reise beitreten: ','join: ')+t.name,[],()=>{put('m_'+id+'_'+uid,{t:'mem',T:id,u:uid,role:'traveller',c:Date.now()});cur=id;tab='home';history.replaceState(null,'',location.pathname)})}
/* punkte / mvp */
function points(){const p={},w=W();mems().forEach(m=>{const c=cnt(m.u);p[m.u]=Object.keys(c).reduce((a,k)=>a+c[k]*w[k],0)});return p}
const mvpEnded=()=>!!(S.i['cfg_'+cur]||{}).ended;
const mode=()=>(S.i['cfg_'+cur]||{}).mode||'once';
const period=()=>{const m=mode(),d=new Date();return m==='day'?d.toISOString().slice(0,10):m==='week'?'KW'+Math.floor(d/6048e5):'trip'};
const plabel=k=>k==='trip'?L('gesamte reise','whole trip'):k.startsWith('KW')?L('woche ','week ')+k.slice(2):dd(k);
function balances(){const b={};mems().forEach(m=>b[m.u]=0);
  list('exp').forEach(e=>{const s=(e.split||[]).filter(u=>u in b);if(!s.length||!(e.payer in b))return;b[e.payer]+=e.amt;s.forEach(u=>b[u]-=e.amt/s.length)});
  const cr=[],de=[];Object.entries(b).forEach(([u,v])=>{v=Math.round(v*100)/100;if(v>.004)cr.push([u,v]);else if(v<-.004)de.push([u,-v])});cr.sort((a,b)=>b[1]-a[1]);de.sort((a,b)=>b[1]-a[1]);
  const t=[];let i=0,j=0;while(i<de.length&&j<cr.length){const x=Math.min(de[i][1],cr[j][1]);t.push([de[i][0],cr[j][0],x]);de[i][1]-=x;cr[j][1]-=x;if(de[i][1]<.005)i++;if(cr[j][1]<.005)j++}return{b,t}}
const cats=()=>L(['an-/abreise','unterkunft','lebensmittel','getränke','restaurant','aktivität','freizeit','mietwagen','sprit','parken','nahverkehr','sonstiges'],['travel','lodging','food','drinks','restaurant','activity','leisure','rental car','fuel','parking','local transport','other']).concat(list('cat').map(c=>c.name));
const own=x=>lead()||x.by===uid;
const leadsHtml=()=>mems().filter(m=>m.role==='travellead').map(m=>{const p=prof(m.u);return `👑 ${esc(dn(m.u))}${p.email?` · <a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`:''}`}).join('<br>')||'–';
const ast=x=>x.st||(x.booked?'plan':'prop'),lt=d=>d&&new Date(d)<new Date(),off=k=>(trip().off||[]).includes(k);
const TR={offen:'open','läuft':'in progress',erledigt:'done',prop:'proposal',plan:'planned',cancel:'cancelled',flug:'flight',zug:'train',bahn:'bus / tram',auto:'car',fahrgemeinschaft:'carpool',mietwagen:'rental car',an:'arrival',ab:'return',vor:'local',supermarkt:'supermarket',parkplatz:'parking',flughafen:'airport',bahnhof:'train station',sonstiges:'other'},TRD={prop:'vorschlag',plan:'geplant',cancel:'abgesagt'};
const tr=v=>(lang==='en'?TR[v]:TRD[v])||v;
const bagtypes=()=>trip().bag||L(['persönliches gepäckstück','handgepäck','aufgabegepäck'],['personal item','carry-on','checked baggage']);
const W=()=>({shop:2,todo:5,exp:1,act:1,mvp:3,...(trip().w||{})});
const WL=()=>({shop:L('einkauf erledigt','shopping done'),todo:L('todo abgeschlossen','todo completed'),exp:L('ausgabe erfasst','expense logged'),act:L('aktivität vorgeschlagen','activity proposed'),mvp:L('mvp-stimme erhalten','mvp vote received')});
function cnt(u){return{shop:list('shop').filter(x=>x.done&&x.doneBy===u).length,todo:list('todo').filter(x=>x.st==='erledigt'&&x.doneBy===u).length,exp:list('exp').filter(x=>x.payer===u).length,act:list('act').filter(x=>x.by===u).length,mvp:list('vote').filter(x=>x.for===u).length}}
function arrows(){document.querySelectorAll('.navw').forEach(w=>{const n=w.querySelector('nav');w.classList.toggle('hl',n.scrollLeft>2);w.classList.toggle('hr',n.scrollLeft+n.clientWidth<n.scrollWidth-2)})}
const X=id=>`<button class="btn s" data-a="del" data-id="${id}">✕</button>`;
const E=m=>`<div class="empty">${m}</div>`;
/* views */
const V={};
V.home=()=>{const t=trip(),days=Math.ceil((new Date(t.s)-Date.now())/864e5),{b}=balances(),pt=points(),n=t.next,
  ev=[...list('act').filter(a=>ast(a)==='plan'&&a.when).map(a=>({w:a.when,x:'🎯 '+a.title})),...list('leg').filter(l=>l.when).map(l=>({w:l.when,x:'🚐 '+l.from+' → '+l.to}))].filter(e=>new Date(e.w)>Date.now()).sort((a,b)=>a.w.localeCompare(b.w)).slice(0,4),
  req=t.settle&&(b[uid]||0)<-.004;
  return `<div class="card" style="text-align:center"><div style="font-size:40px">${esc(t.av)}</div><b>${esc(t.name)}</b> ${lead()?`<button class="btn s" data-a="edittrip" data-id="${cur}">✏️</button>`:''}<div class="mu">${esc(t.ort)} · ${dd(t.s)} – ${dd(t.e)}</div>
  <div class="mu">${L('travellead','travellead')}: ${leadsHtml()}</div><div><a href="https://www.google.com/search?q=${encodeURIComponent('wetter '+t.ort)}" target="_blank" rel="noopener">🌤 ${L('wetter','weather')} ↗</a></div><div class="big">${days>0?days:days>-((new Date(t.e)-new Date(t.s))/864e5)?'🎉':'✓'}</div><div class="mu">${days>0?L('tage bis zur reise','days until the trip'):L('die reise läuft / ist vorbei','trip is on / over')}</div></div>
  ${n?`<div class="card" data-go="transfer|orte"><div class="mu">${L('nächstes ziel','next destination')}</div><b>📍 ${esc(n.name)}</b> <a href="${maps(n.addr||n.name)}" target="_blank" rel="noopener">google maps ↗</a></div>`:''}
  ${req?`<div class="card bad" data-go="fin">💶 ${L('ausgleich angefordert: bitte saldo begleichen','settlement requested: please settle your balance')}</div>`:''}
  <div class="row"><div class="card" data-go="fin" style="flex:1"><div class="mu">${L('mein saldo','my balance')}</div><div class="pts ${(b[uid]||0)>=0?'ok':'bad'}">${eur(b[uid]||0)}</div></div><div class="card" data-go="rank|score" style="flex:1"><div class="mu">travelscore</div><div class="pts">${pt[uid]||0}</div></div></div>
  <h2>${L('nächste termine','upcoming')}</h2>${ev.map(e=>`<div class="card row" data-go="schedule"><span>${esc(e.x)}</span><span class="gold">${dt(e.w)}</span></div>`).join('')||E(L('keine termine','nothing scheduled'))}
  ${list('todo').filter(x=>x.to===uid&&x.st!=='erledigt').length?`<h2>${L('meine offenen todos','my open todos')}</h2>`+list('todo').filter(x=>x.to===uid&&x.st!=='erledigt').map(x=>`<div class="card" data-go="todo|meine">${esc(x.title)} <span class="mu">${x.due?dd(x.due):''}</span></div>`).join(''):''}`};
const SUBS=()=>({transfer:[['reisen',L('reisen','journeys')],['personalien',L('personalien','personal data')],['gepaeck',L('gepäck','luggage')],['packliste',L('packliste','packing list')],['orte',L('orte','places')]],wohnen:[['unterkunft',L('unterkunft','lodging')],['zimmer',L('zimmer','rooms')],['einkauf',L('einkauf','shopping')]],fin:[['ausgaben',L('ausgaben','expenses')],['kalkulation',L('kalkulation','budget')]],act:[['vorschlaege',L('vorschläge','proposals')],['geplant',L('geplant','planned')]],todo:[['meine',L('meine','mine')],['alle',L('alle','all')]],rank:[['score','travelscore'],['mvp','travelmvp']],team:[['team',L('zugang','access')],['settings',L('einstellungen','settings')]]});
const subList=t=>(SUBS()[t]||[]).filter(s=>!off(t+'.'+s[0])&&!(t==='team'&&s[0]==='settings'&&!lead()));
V.transfer=()=>({
 reisen:()=>{const l=list('leg').sort((a,b)=>(a.when||'').localeCompare(b.when||''));return l.map(x=>`<div class="card"><div class="row"><div><span class="tag">${x.dir==='an'?L('anreise','arrival'):x.dir==='ab'?L('abreise','return'):L('vor ort','local')}</span><span class="tag">${esc(tr(x.mode))}</span>${x.no?`<span class="tag">${esc(x.no)}</span>`:''}<b>${esc(x.from)} → ${esc(x.to)}</b></div>${lead()?X(x.id):''}</div>
  <div class="mu">${dt(x.when)}${x.arr?' → '+dt(x.arr):x.dur?' · '+esc(x.dur):''}${x.driver?' · 🚗 '+esc(dn(x.driver)):''}${x.note?' · '+esc(x.note):''}</div>${x.park?`<div class="mu">🅿️ ${esc(x.park)} · ${(x.pw||[]).map(dn).map(esc).join(', ')||'–'}</div>`:''}
